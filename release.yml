name: Build & Release EXE

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        run: |
          cd ui
          npm install
          npm run build

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build EXE
        run: pyinstaller mcp-gateway.spec

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-gateway-windows
          path: dist/mcp-gateway.exe
